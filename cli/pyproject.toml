[project]
name = "verifyiq-cli"
version = "0.1.0"
description = "CLI for VerifyIQ verification platform"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
verifyiq = "verifyiq_cli.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
